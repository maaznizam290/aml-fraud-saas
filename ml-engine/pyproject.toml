[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-ml"
version = "0.1.0"
description = "Deterministic risk engine + ML fraud detection service for the AML/Fraud Investigation SaaS."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# (str, Enum) is kept deliberately over StrEnum for stable str()/repr()
# behavior across pydantic's serialization — not a bug, so not auto-fixed.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures with many named kwargs read better on one line than wrapped.
"tests/*" = ["E501"]
